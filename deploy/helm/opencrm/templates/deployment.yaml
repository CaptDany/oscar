apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oscar.fullname" . }}-backend
  labels:
    {{- include "oscar.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    oscar.dev/ci-build: "{{ .Values.ci.buildNumber | default "manual" }}"
    oscar.dev/ci-commit: "{{ .Values.ci.commitSha | default "unknown" }}"
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "oscar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        {{- include "oscar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "oscar.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
            - name: APP_PORT
              value: {{ .Values.env.APP_PORT | quote }}
            - name: APP_BASE_URL
              value: {{ .Values.env.APP_BASE_URL | quote }}
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: oscar-app-secret
                  key: app-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "oscar.fullname" . }}-secret
                  key: database-url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "oscar.fullname" . }}-secret
                  key: redis-url
                  optional: true
            - name: R2_ACCOUNT_ID
              value: {{ .Values.env.R2_ACCOUNT_ID | quote }}
            - name: R2_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "oscar.fullname" . }}-secret
                  key: r2-access-key
                  optional: true
            - name: R2_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "oscar.fullname" . }}-secret
                  key: r2-secret-key
                  optional: true
            - name: R2_BUCKET
              value: {{ .Values.env.R2_BUCKET | quote }}
            - name: R2_PUBLIC_URL
              value: {{ .Values.env.R2_PUBLIC_URL | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oscar.fullname" . }}-api
  labels:
    {{- include "oscar.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "oscar.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oscar.fullname" . }}-secret
  labels:
    {{- include "oscar.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
