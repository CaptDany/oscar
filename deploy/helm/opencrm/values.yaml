replicaCount: 1

image:
  repository: ghcr.io/captdany/oscar
  pullPolicy: Always
  tag: "latest"

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/captdany/oscar-frontend
    pullPolicy: Always
    tag: "latest"
  service:
    type: ClusterIP
    port: 4321
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4321"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  livenessProbe:
    tcpSocket:
      port: 4321
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 4321
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

imagePullSecrets:
  - name: ghcr-pull
# Provider-agnostic: works with any K8s cluster.
# For OKE free tier: create pull secret manually (no OIDC free support):
#   kubectl create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=<user> \
#     --docker-password=<PAT> \
#     -n <namespace>
# For GKE/AKS/EKS with OIDC: remove this block and rely on Workload Identity.
# See docs/CI-CD.md: "Provider Migration" for switching instructions.

nameOverride: ""
fullnameOverride: ""

ci:
  buildNumber: ""
  commitSha: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: oscar-crm.cc
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: oscar-tls
      hosts:
        - oscar-crm.cc

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - oscar
          topologyKey: kubernetes.io/hostname

ci:
  buildNumber: ""
  commitSha: ""

env:
  APP_ENV: production
  APP_PORT: "8080"
  APP_BASE_URL: "https://oscar-crm.cc"
  APP_FRONTEND_URL: "https://oscar-crm.cc"
  DATABASE_URL: ""
  REDIS_URL: ""
  R2_ACCOUNT_ID: ""
  R2_ACCESS_KEY: ""
  R2_SECRET_KEY: ""
  R2_BUCKET: oscar
  R2_PUBLIC_URL: ""
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""
  OAUTH_APPLE_CLIENT_ID: ""
  OAUTH_APPLE_CLIENT_SECRET: ""
  OAUTH_DISCORD_CLIENT_ID: ""
  OAUTH_DISCORD_CLIENT_SECRET: ""
  DISCORD_BOT_TOKEN: ""

secret:
  enabled: true
  annotations: {}
  data: {}

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

postgresql:
  enabled: false
  # Set to true only if deploying Postgres via Helm
  externalHost: ""
  externalPort: 5432
  database: oscar
  username: oscar

redis:
  enabled: false
  # Set to true only if deploying Redis via Helm
  externalHost: ""
  externalPort: 6379
