name: CD

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production

permissions: read-all

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io
  IMAGE_NAME: captdany/oscar
  DOCKERFILE: docker/Dockerfile
  FRONTEND_IMAGE_NAME: captdany/oscar-frontend
  FRONTEND_DOCKERFILE: docker/Dockerfile.frontend

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.semver.outputs.semver }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Calculate semantic version
        id: semver
        run: |
          if git describe --tags --abbrev=0 2>/dev/null; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            COMMITS=$(git rev-list --count "$LAST_TAG"..HEAD)
            MAJOR=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | cut -d. -f3)
          else
            MAJOR=0; MINOR=1; PATCH=0; COMMITS=0
          fi
          [ "$COMMITS" -gt 0 ] && PATCH=$COMMITS
          echo "semver=$MAJOR.$MINOR.$PATCH-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Images
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}
      frontend-image-ref: ${{ steps.frontend-image.outputs.ref }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.semver }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - id: image
        run: echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - id: frontend-meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.semver }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - id: frontend-build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ env.FRONTEND_DOCKERFILE }}
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: frontend-image
        run: echo "ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}@${{ steps.frontend-build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy to Dev
    needs: [version, build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.deploy-url.outputs.url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Configure kubectl
        run: |
          echo "$CA_B64" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster oke-cluster \
            --server=https://155.248.145.242:6443 \
            --certificate-authority=/tmp/ca.crt \
            --embed-certs=true
          kubectl config set-credentials github-actions \
            --token=${{ secrets.SA_TOKEN }}
          kubectl config set-context github-actions-context \
            --cluster=oke-cluster \
            --user=github-actions
          kubectl config use-context github-actions-context
          rm -f /tmp/ca.crt
        env:
          CA_B64: 
      - name: Verify cluster access
        run: |
          kubectl version --client
          kubectl get nodes
      - name: Deploy Helm chart
        run: |
          helm upgrade --install oscar deploy/helm/opencrm \
            --namespace oscar-dev \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.version.outputs.semver }} \
            --set image.pullPolicy=Always \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }} \
            --set frontend.image.tag=${{ needs.version.outputs.semver }} \
            --set ci.buildNumber=${{ github.run_id }} \
            --set ci.commitSha=${{ github.sha }} \
            --set env.APP_ENV=development \
            --set env.APP_BASE_URL=https://dev.oscar-crm.cc \
            --set secret.data.database-url=postgres://oscar:oscar@postgres.oscar-dev.svc.cluster.local:5432/oscar \
            --set ingress.hosts[0].host=dev.oscar-crm.cc \
            --set ingress.tls[0].secretName=oscar-tls \
            --set ingress.tls[0].hosts[0]=dev.oscar-crm.cc \
            --atomic --wait --timeout 10m
      - id: deploy-url
        run: echo "url=https://dev.oscar-crm.cc" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          sleep 10
          curl -sf --retry 10 --retry-delay 5 --retry-connrefused \
            https://dev.oscar-crm.cc/health || exit 1
      - name: Frontend smoke test
        run: |
          curl -sf --retry 10 --retry-delay 5 --retry-connrefused \
            https://dev.oscar-crm.cc/ || exit 1

  deploy-staging:
    name: Deploy to Staging
    needs: [version, build-and-push, deploy-dev]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy-url.outputs.url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Configure kubectl
        run: |
          echo "$CA_B64" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster oke-cluster \
            --server=https://155.248.145.242:6443 \
            --certificate-authority=/tmp/ca.crt \
            --embed-certs=true
          kubectl config set-credentials github-actions \
            --token=${{ secrets.SA_TOKEN }}
          kubectl config set-context github-actions-context \
            --cluster=oke-cluster \
            --user=github-actions
          kubectl config use-context github-actions-context
          rm -f /tmp/ca.crt
        env:
          CA_B64: 
      - name: Verify cluster access
        run: |
          kubectl version --client
          kubectl get nodes
      - name: Deploy Helm chart
        run: |
          helm upgrade --install oscar deploy/helm/opencrm \
            --namespace oscar-staging \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.version.outputs.semver }} \
            --set image.pullPolicy=Always \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }} \
            --set frontend.image.tag=${{ needs.version.outputs.semver }} \
            --set ci.buildNumber=${{ github.run_id }} \
            --set ci.commitSha=${{ github.sha }} \
            --set replicaCount=2 \
            --set env.APP_ENV=staging \
            --set env.APP_BASE_URL=https://staging.oscar-crm.cc \
            --set secret.data.database-url=postgres://oscar:oscar@postgres.oscar-staging.svc.cluster.local:5432/oscar \
            --set ingress.hosts[0].host=staging.oscar-crm.cc \
            --set ingress.tls[0].secretName=oscar-tls \
            --set ingress.tls[0].hosts[0]=staging.oscar-crm.cc \
            --atomic --wait --timeout 10m
      - id: deploy-url
        run: echo "url=https://staging.oscar-crm.cc" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          sleep 10
          curl -sf --retry 10 --retry-delay 5 --retry-connrefused \
            https://staging.oscar-crm.cc/health || exit 1

  deploy-production:
    name: Deploy to Production
    needs: [version, build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy-url.outputs.url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Configure kubectl
        run: |
          echo "$CA_B64" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster oke-cluster \
            --server=https://155.248.145.242:6443 \
            --certificate-authority=/tmp/ca.crt \
            --embed-certs=true
          kubectl config set-credentials github-actions \
            --token=${{ secrets.SA_TOKEN }}
          kubectl config set-context github-actions-context \
            --cluster=oke-cluster \
            --user=github-actions
          kubectl config use-context github-actions-context
          rm -f /tmp/ca.crt
        env:
          CA_B64: 
      - name: Verify cluster access
        run: |
          kubectl version --client
          kubectl get nodes
      - name: Deploy Helm chart
        run: |
          helm upgrade --install oscar deploy/helm/opencrm \
            --namespace oscar-production \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.version.outputs.semver }} \
            --set image.pullPolicy=Always \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }} \
            --set frontend.image.tag=${{ needs.version.outputs.semver }} \
            --set ci.buildNumber=${{ github.run_id }} \
            --set ci.commitSha=${{ github.sha }} \
            --set replicaCount=3 \
            --set env.APP_ENV=production \
            --set env.APP_BASE_URL=https://oscar-crm.cc \
            --set secret.data.database-url=postgres://oscar:oscar@postgres.oscar-production.svc.cluster.local:5432/oscar \
            --set ingress.hosts[0].host=oscar-crm.cc \
            --set ingress.tls[0].secretName=oscar-tls \
            --set ingress.tls[0].hosts[0]=oscar-crm.cc \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=2 \
            --set autoscaling.maxReplicas=10 \
            --atomic --wait --timeout 10m
      - id: deploy-url
        run: echo "url=https://oscar-crm.cc" >> "$GITHUB_OUTPUT"
      - name: Canary smoke test
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://oscar-crm.cc/health)
            if [ "$STATUS" = "200" ]; then
              echo "Passed"; exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Record deployment
        continue-on-error: true
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            try {
              await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'production',
                auto_merge: false,
                required_contexts: []
              });
            } catch (e) {
              core.warning(`Could not record deployment: ${e.message}`);
            }
