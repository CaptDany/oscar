name: Rollback

permissions: read-all

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to rollback"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      target-tag:
        description: "Previous image tag to rollback to (e.g., v1.2.3)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: captdany/oscar

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure kubectl (provider-agnostic via kubeconfig secret)
        run: |
          mkdir -p ~/.kube
          SECRET_VAR="KUBECONFIG_${{ github.event.inputs.environment }}"
          echo "${!SECRET_VAR}" | base64 -d > ~/.kube/config
        shell: bash
        env:
          KUBECONFIG_DEV: ${{ secrets.KUBECONFIG_DEV }}
          KUBECONFIG_STAGING: ${{ secrets.KUBECONFIG_STAGING }}
          KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}

      - name: Rollback Helm release
        run: |
          helm rollback oscar --namespace oscar-${{ github.event.inputs.environment }} --wait --timeout 5m
        continue-on-error: true

      - name: Deploy previous image if rollback fails
        if: failure()
        run: |
          helm upgrade --install oscar deploy/helm/opencrm \
            --namespace oscar-${{ github.event.inputs.environment }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.event.inputs.target-tag }} \
            --atomic --wait --timeout 5m

      - name: Verify deployment
        run: |
          ENV_DOMAIN="${{ github.event.inputs.environment }}.oscar-crm.cc"
          [ "${{ github.event.inputs.environment }}" = "production" ] && ENV_DOMAIN="oscar-crm.cc"
          curl -sf --retry 10 --retry-delay 5 --retry-connrefused "https://$ENV_DOMAIN/health" || exit 1

      - name: Record incident
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Rollback executed: ${{ github.event.inputs.environment }} to ${{ github.event.inputs.target-tag }}`,
              body: [
                '## Pipeline Incident',
                '',
                `**Environment:** ${{ github.event.inputs.environment }}`,
                `**Rollback target:** ${{ github.event.inputs.target-tag }}`,
                `**Timestamp:** ${new Date().toISOString()}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '**DevOps Anti-pattern:** Deploy failure triggering rollback indicates insufficient pre-production validation (cf. Accelerate, p. 73).',
                '**Lean Waste:** Defects found downstream — shift left on testing.',
                '',
                '**To investigate:**',
                '1. Review the workflow run linked above.',
                '2. Check application logs in the affected namespace.',
                '3. Determine root cause and add regression tests.'
              ].join('\n'),
              labels: ['pipeline-incident']
            });
