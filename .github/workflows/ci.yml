name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions: read-all

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
            frontend:
              - 'web/**'
            docker:
              - 'docker/**'
              - 'Dockerfile'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

  lint-backend:
    name: Lint (Backend)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test-backend:
    name: Test (Backend)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests with coverage
        run: go test -v -short -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 7

  build-backend:
    name: Build (Backend)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.docker == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Cross-compile Linux binary
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/oscar-linux ./cmd/server
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oscar-linux-amd64
          path: bin/oscar-linux
          retention-days: 3

  build-frontend:
    name: Build (Frontend)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build

  security-audit:
    name: Security Audit
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (warnings only, non-blocking)
        run: govulncheck ./... 2>&1 | tee vuln-report.txt || true
      - name: Parse vulnerabilities
        id: vuln-parse
        run: |
          if grep -qi "Vulnerabilities" vuln-report.txt 2>/dev/null; then
            echo "Vulnerabilities found. See report."
            echo "has_vulns=true" >> "$GITHUB_OUTPUT"
          else
            echo "No vulnerabilities found."
            echo "has_vulns=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        continue-on-error: true
        if: steps.vuln-parse.outputs.has_vulns == 'true' && github.event_name == 'pull_request'
        with:
          script: |
            try {
              const fs = require('fs');
              const report = fs.readFileSync('vuln-report.txt', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Security Audit Results\n\n\`\`\`\n${report.slice(0, 2000)}\n\`\`\`\n\n> Review these findings before merge.`
              });
            } catch (e) {
              core.warning(`Could not post security audit comment: ${e.message}`);
            }

  docker-build-check:
    name: Docker Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docker == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Build image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: oscar:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: critical

  required-checks-passed:
    name: Required Checks
    if: always()
    needs:
      - lint-backend
      - test-backend
      - build-backend
      - build-frontend
      - security-audit
      - docker-build-check
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const results = ${{ toJSON(needs) }};
            const ignored = ['detect-changes'];
            const failed = Object.entries(results)
              .filter(([k]) => !ignored.includes(k))
              .filter(([,v]) => v.result === 'failure' || v.result === 'cancelled');
            if (failed.length > 0) {
              core.setFailed(`Failed: ${failed.map(([k]) => k).join(', ')}`);
            } else {
              core.info('All required checks passed');
            }
