name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
            frontend:
              - 'web/**'
            docker:
              - 'docker/**'
              - 'Dockerfile'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

  lint-backend:
    name: Lint (Backend)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test-backend:
    name: Test (Backend)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests with coverage
        run: go test -v -short -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 7

  build-backend:
    name: Build (Backend)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.docker == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Cross-compile Linux binary
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/oscar-linux ./cmd/server
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oscar-linux-amd64
          path: bin/oscar-linux
          retention-days: 3

  build-frontend:
    name: Build (Frontend)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build

  security-audit:
    name: Security Audit
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (warnings only, non-blocking)
        run: govulncheck ./... 2>&1 | tee vuln-report.txt || true
      - name: Parse vulnerabilities
        id: vuln-parse
        run: |
          if grep -qi "Vulnerabilities" vuln-report.txt 2>/dev/null; then
            echo "Vulnerabilities found. See report."
            echo "has_vulns=true" >> "$GITHUB_OUTPUT"
          else
            echo "No vulnerabilities found."
            echo "has_vulns=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/github-script@v7
        if: steps.vuln-parse.outputs.has_vulns == 'true' && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('vuln-report.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Security Audit Results\n\n\`\`\`\n${report.slice(0, 2000)}\n\`\`\`\n\n> Review these findings before merge.`
            });

  docker-build-check:
    name: Docker Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docker == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: oscar:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: critical

  required-checks-passed:
    name: Required Checks
    if: always()
    needs:
      - lint-backend
      - test-backend
      - build-backend
      - build-frontend
      - security-audit
      - docker-build-check
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const results = ${{ toJSON(needs) }};
            const ignored = ['detect-changes'];
            const failed = Object.entries(results)
              .filter(([k]) => !ignored.includes(k))
              .filter(([,v]) => v.result === 'failure' || v.result === 'cancelled');
            if (failed.length > 0) {
              core.setFailed(`Failed: ${failed.map(([k]) => k).join(', ')}`);
            } else {
              core.info('All required checks passed');
            }
